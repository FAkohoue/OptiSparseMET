# Build the pkgdown site and publish it via GitHub Pages (Actions source).
# Based on the official r-lib/actions example; pak installs all dependencies
# and their system requirements, so no manual apt-get / Bioconductor steps.
name: pkgdown

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        shell: Rscript {0}
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)

      - name: Publish the Breeder's Guide alongside the site
        # The navbar "breeder_guide" component links to this filename at the
        # site root; copy the version-controlled PDF into docs/ so the link works.
        run: cp inst/guides/OptiSparseMET_Breeders_Guide.pdf docs/OptiSparseMET_Breeders_Guide.pdf

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
